[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sscatfacts-api"
version = "0.1.0"
description = "Backend API for SSCatFacts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sscatfacts"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
